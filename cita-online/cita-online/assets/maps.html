<!DOCTYPE html>
<html style="overflow-y: hidden">
  <head>
    <style>
       /* Set the size of the div element that contains the map */
      #map {
        height: 250px;  /* The height is 400 pixels */
        width: 100%;  /* The width is the width of the web page */
       }
    </style>
  </head>
  <body>
    <!--The div element for the map -->
    <div id="map"></div>
    <script>
        function findGetParameter(parameterName) {
            var result = null,
            tmp = [];
            location.search
            .substr(1)
            .split("&")
            .forEach(function (item) {
            tmp = item.split("=");
            if (tmp[0] === parameterName) result = decodeURIComponent(tmp[1]);
            });
            return result;
        }

        var GOOGLE_MAP_KEY = findGetParameter("key");

        // Initialize and add the map
        function initMap() {
            // The location of Uluru
            var uluru = {lat: parseFloat(findGetParameter("lat")), lng: parseFloat(findGetParameter("lng"))};
            // The map, centered at Uluru
            var map = new google.maps.Map(
                document.getElementById('map'), {zoom: 16, center: uluru});
            // The marker, positioned at Uluru            
            var marker = new google.maps.Marker({position: uluru, map: map});
        }

        function loadScript() {            
            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://maps.googleapis.com/maps/api/js?key=' + GOOGLE_MAP_KEY + '&callback=initMap';
            document.body.appendChild(script);
        }
    
        window.onload = loadScript;
        </script>
    <!--Load the API from the specified URL
    * The async attribute allows the browser to render the page while the API loads
    * The key parameter will contain your own API key (which is not needed for this tutorial)
    * The callback parameter executes the initMap() function
   
    <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAYu2--OCaQ-HcDXUiZi8Lwz7bhhZhJI1A&callback=initMap">
    </script> -->
  </body>
</html>
